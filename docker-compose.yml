services:
  postgres:
    image: postgres:17
    container_name: skillops-postgres
    environment:
      POSTGRES_DB: skillops
      POSTGRES_USER: skillops
      POSTGRES_PASSWORD: skillops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillops -d skillops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
