# 행동 변경이다. 배송 예약 본문에 '해외 배송은 받지 않는다'를 적고 의도를 함께 저장했다.
# 규칙을 배송 예약에 걸면 이미 결제된 뒤라 의도를 지키지 못한다. 결제보다 앞 단계(주문 접수)에 걸어야 한다.
id: B-02
group: B
title: 배송 예약 본문에 '해외 배송은 받지 않는다'를 적고 의도를 함께 저장함
set: dev
run: auto

change:
  - file: skills/shipping-reserve/SKILL.md
    from: "결제 PAID와 재고 예약을 확인합니다."
    to: "결제 PAID와 재고 예약을 확인합니다. 해외 배송(KR 이 아닌 국가) 주문은 받지 않습니다."

intent:
  text: 해외 배송 주문은 받지 않고 결제도 하지 않는다
  expectations:
    - scope: "order.shipping.country != 'KR'"
      checks: ["order.final_status == 'REJECTED'", "payment.status == null"]
  repro: [g-05]

order_agent:
  # 의도 없이 돌린 반응이다. 규칙 모드는 본문을 읽지 않으므로 모두 통과한다.
  g-01: {result: pass}
  g-02: {result: pass}
  g-03: {result: pass}
  g-04: {result: pass}
  g-05: {result: pass}
  g-06: {result: pass}

answer:
  status: [EVALUATED]
  proposal: [proposed]
  root_cause: [shipping-reserve]
  root_cause_kind: incomplete_edit
  fixable: true
  rule_skills: [order-intake, inventory-check, payment]

fixes:
  - name: 주문 접수에 국내 배송 규칙(rules)을 더함
    change:
      - file: skills/order-intake/SKILL.md
        from: "depends_on: []\n"
        to: "depends_on: []\nrules:\n  - when: \"order.shipping.country != 'KR'\"\n    then: reject\n    reason: DOMESTIC_ONLY\n"
    tests_pass: true
    valid: true
  - name: 배송 예약에 규칙을 더함(잘못된 위치)
    change:
      - file: skills/shipping-reserve/SKILL.md
        from: "depends_on: [payment]\n"
        to: "depends_on: [payment]\nrules:\n  - when: \"order.shipping.country != 'KR'\"\n    then: reject\n    reason: DOMESTIC_ONLY\n"
    tests_pass: false
    failure: "payment.status == null"
    valid: false
  - name: 되돌리기
    change:
      - file: skills/shipping-reserve/SKILL.md
        from: "결제 PAID와 재고 예약을 확인합니다. 해외 배송(KR 이 아닌 국가) 주문은 받지 않습니다."
        to: "결제 PAID와 재고 예약을 확인합니다."
    tests_pass: false
    failure: "order.final_status == 'REJECTED'"
    valid: false

evidence:
  - claim: 의도 없이 돌리면 표준 주문 g-01~g-06 이 모두 통과한다. 미국 배송 g-05 도 SHIPPED 다
    kind: 코드 근거
    where: >-
      order-agent/backend/src/main/java/com/capstone4/orderagent/harness/FixedDecisionProvider.java,
      order-agent/backend/src/main/java/com/capstone4/orderagent/adapter/ShippingMockAdapter.java 의 SUPPORTED_COUNTRIES
  - claim: 의도 범위 주문은 g-05 하나이고, 수정본에서는 SHIPPED 에 결제 PAID 라 떨어진다
    kind: 코드 근거
    where: scenarios/order-agent/golden/g-05.json, scenarios/README.md
  - claim: 원인은 배송 예약 본문 수정이고 종류는 의도 미실현(incomplete_edit)이다
    kind: 구성, 정의
    where: 넣은 수정이 배송 예약 본문 하나이고 수정본은 오류 없이 돈다. docs/plans/2026-10-26-behavior-edit-root-fix.md 2.5
  - claim: 주문 접수에 규칙을 걸면 의도를 살린다
    kind: 존재 증명
    where: >-
      fixes 의 첫 안. 주문 접수는 이미 order.shipping 을 입력으로 받고(order-agent/skills/order-intake/SKILL.md), 규칙 조건은 입력의
      하위 값(order.shipping.country)을 쓸 수 있다(계획 2.1, 2.2)
  - claim: 배송 예약에 규칙을 걸면 결제가 남아 불합격이다
    kind: 불가능 증명
    where: >-
      배송 예약은 결제 뒤 단계이고 규칙 종료는 결제 상태를 건드리지 않는다(계획 2.2). 그래서 g-05 가 REJECTED 로 끝나도 payment.status 가
      PAID 로 남아 확인 조건 payment.status == null 에서 떨어진다. fixes 의 두 번째 안으로 확인한다
  - claim: 규칙은 결제 도구보다 앞 단계(order-intake, inventory-check, payment)에 둘 때만 의도를 지킨다
    kind: 코드 근거
    where: B-01 의 같은 근거. inventory-check 와 payment 에 두려면 order.shipping 을 inputs 에 더한다
  - claim: 되돌리기는 불합격이다
    kind: 합의
    where: qa/README.md 판정 규칙 R1, 계획 2.6
  - claim: 의도와 확인 조건
    kind: 정의
    where: 이 케이스 파일의 intent

current:
  result: 구현 중(2026-10-26), check 미실행
  defects: [D1]
