# 행동 변경이다. 결제 본문에 '10만 원 이상 주문은 보류한다'를 적고 의도를 함께 저장했다.
# 숫자 비교 조건(조건 문법 v2 의 >=)으로 규칙을 써야 하고, 금액(order.total)은 주문 접수 뒤에야 생긴다.
id: B-03
group: B
title: 결제 본문에 '10만 원 이상 주문은 보류한다'를 적고 의도를 함께 저장함
set: dev
run: auto

change:
  - file: skills/payment/SKILL.md
    from: "재고 예약 성공을 확인합니다."
    to: "재고 예약 성공을 확인합니다. 주문 금액이 10만 원 이상이면 결제하지 않고 보류합니다."

intent:
  text: 10만 원 이상 주문은 결제하지 않고 보류한다
  # scope 의 order.total 은 service 가 상품 단가 × 수량으로 계산한다(계획 2.3). g-06 은 랜턴 4개 120000원이다.
  expectations:
    - scope: "order.total >= 100000"
      checks: ["order.final_status == 'HOLD'", "payment.status == null"]
  repro: [g-06]

order_agent:
  # 의도 없이 돌린 반응이다. 규칙 모드는 본문을 읽지 않으므로 모두 통과한다.
  g-01: {result: pass}
  g-02: {result: pass}
  g-03: {result: pass}
  g-04: {result: pass}
  g-05: {result: pass}
  g-06: {result: pass}

answer:
  status: [EVALUATED]
  proposal: [proposed]
  root_cause: [payment]
  root_cause_kind: incomplete_edit
  fixable: true
  # order.total 은 주문 접수가 내놓는 값이라 주문 접수에는 규칙을 둘 수 없다.
  rule_skills: [inventory-check, payment]

fixes:
  - name: 결제에 고액 보류 규칙(rules)을 더함
    change:
      - file: skills/payment/SKILL.md
        from: "depends_on: [inventory-check]\n"
        to: "depends_on: [inventory-check]\nrules:\n  - when: \"order.total >= 100000\"\n    then: hold\n    reason: HIGH_AMOUNT\n"
    tests_pass: true
    valid: true
  - name: 되돌리기
    change:
      - file: skills/payment/SKILL.md
        from: "재고 예약 성공을 확인합니다. 주문 금액이 10만 원 이상이면 결제하지 않고 보류합니다."
        to: "재고 예약 성공을 확인합니다."
    tests_pass: false
    failure: "order.final_status == 'HOLD'"
    valid: false

evidence:
  - claim: 의도 없이 돌리면 표준 주문 g-01~g-06 이 모두 통과한다. g-06 은 120000원으로 결제·배송된다
    kind: 코드 근거
    where: order-agent/backend/src/main/java/com/capstone4/orderagent/harness/FixedDecisionProvider.java, scenarios/README.md
  - claim: 의도 범위 주문은 g-06 하나다(나머지는 30000원 이하)
    kind: 코드 근거
    where: order-agent/backend/src/main/resources/data.sql 의 단가, scenarios/order-agent/golden
  - claim: 원인은 결제 본문 수정이고 종류는 의도 미실현(incomplete_edit)이다
    kind: 구성, 정의
    where: 넣은 수정이 결제 본문 하나이고 수정본은 오류 없이 돈다. docs/plans/2026-10-26-behavior-edit-root-fix.md 2.5
  - claim: 결제에 rules 를 더하면 의도를 살린다
    kind: 존재 증명
    where: fixes 의 첫 안. 결제는 이미 order.total 을 입력으로 받는다(order-agent/skills/payment/SKILL.md)
  - claim: 주문 접수에는 규칙을 둘 수 없다
    kind: 불가능 증명
    where: >-
      order.total 은 처음 주문 값에서 감춰져 주문 접수가 도구 결과로 내놓는다
      (order-agent/backend/src/main/java/com/capstone4/orderagent/harness/OrderFlowPolicy.java 의 HIDDEN_INITIAL_KEYS). 주문 접수의 입력이
      될 수 없으므로 규칙 키로 쓰면 RULE_KEY_NOT_INPUT, 입력에 더하면 실행 전 검사의 CONTRACT_VIOLATION 이다(계획 2.2)
  - claim: 되돌리기는 불합격이다
    kind: 합의
    where: qa/README.md 판정 규칙 R1, 계획 2.6
  - claim: 의도와 확인 조건
    kind: 정의
    where: 이 케이스 파일의 intent

current:
  result: 구현 중(2026-10-26), check 미실행
  defects: [D1]
