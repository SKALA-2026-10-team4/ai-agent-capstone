# 실행 순서를 바꾼 경우다. 지금 구조에서는 Skill 수정만으로 의도를 살릴 수 없다.
id: D-01
group: D
title: 배송 예약을 결제보다 앞으로 옮김
set: dev
run: auto

change:
  - file: skills/order-flow/SKILL.md
    from: "steps: [order-intake, inventory-check, payment, shipping-reserve, notify]"
    to: "steps: [order-intake, inventory-check, shipping-reserve, payment, notify]"

intent:
  # 순서를 바꾸려는 의도는 확인 조건 문법('<값 이름> ==|!=|in <값>')으로 쓸 수 없어 조건이 없다.
  text: 배송 가능 여부를 결제 전에 확인하고 싶다
  checks: []

order_agent:
  g-01: &blocked {result: error, category: CONTRACT_VIOLATION, skill: shipping-reserve, missing: [payment.id, payment.status], deps: [payment]}
  g-02: *blocked
  g-03: *blocked

answer:
  status: [EVALUATED]
  proposal: [no_valid_fix]
  root_cause: [order-flow]
  fixable: false

fixes:
  - name: 순서를 유지하고 배송이 결제 값을 받지 않게 함
    change:
      - file: skills/shipping-reserve/SKILL.md
        from: "inputs: [order.id, order.shipping, payment.id, payment.status, inventory.reserved]"
        to: "inputs: [order.id, order.shipping, inventory.reserved]"
      - file: skills/shipping-reserve/SKILL.md
        from: "depends_on: [payment]"
        to: "depends_on: [inventory-check]"
    tests_pass: false
    failure: TOOL_ERROR
    valid: false
  - name: 되돌리기
    change:
      - file: skills/order-flow/SKILL.md
        from: "steps: [order-intake, inventory-check, shipping-reserve, payment, notify]"
        to: "steps: [order-intake, inventory-check, payment, shipping-reserve, notify]"
    tests_pass: true
    valid: false

evidence:
  - claim: 배송 단계가 실행 전 검사에서 결제 값과 선행 단계 없이 멈춘다
    kind: 관찰
    where: check 실행 기록
  - claim: 원인은 order-flow 의 steps 순서다
    kind: 구성, 되돌려 보기
    where: check 에서 순서를 되돌리면 재현 주문이 통과한다
  - claim: 고칠 수 없다
    kind: 불가능 증명
    where: >-
      배송 도구는 결제된 주문만 받는다(order-agent/backend/src/main/java/com/capstone4/orderagent/adapter/ShippingMockAdapter.java
      의 reserve, order-agent/backend/src/main/java/com/capstone4/orderagent/entity/Order.java 의 shipped). 배송이 결제보다
      먼저 도는 흐름은 Skill 파일을 어떻게 고쳐도 도구 단계(TOOL_ERROR)에서 멈춘다. 별도의 배송 가능 확인 Skill 은 새 파일과
      도구 바인딩이 필요해 지금 범위 밖이다
  - claim: 되돌리기는 불합격이다
    kind: 합의
    where: qa/README.md 판정 규칙 R1

current:
  checked: 2026-10-23
  result: 원인은 맞게 짚지만 되돌리기가 합격으로 판정돼 proposed 로 끝난다
  defects: [D1]
