# 시험 환경 자체가 깨진 경우다. 수정본 탓으로 판정하지 않아야 한다.
id: E-01
group: E
title: 수정 전에도 표준 주문이 실패하는 환경(랜턴 재고 0)
set: dev
run: manual

steps:
  - "랜턴 재고를 기록한다. docker exec order-agent-db-1 psql -U order_demo -d order_demo -c \"select stock_quantity from products where sku='CAMP-LANTERN-LED'\""
  - "재고를 0 으로 바꾼다. 같은 명령에서 update products set stock_quantity=0 where sku='CAMP-LANTERN-LED' 를 실행한다."
  - "uv run run_qa.py eval --only N-01 을 실행한다. 보고서에서 N-01 은 FAIL 로 나와야 정상이다(정답이 VALIDATED 인 케이스를 환경이 깨진 채 돌렸기 때문이다)."
  - "재고를 1단계에서 기록한 값으로 되돌린다."
expected: 진단 결론이 BASELINE_FAILED 이고 제안서가 없다. 진단 화면에 기준 세트도 통과하지 못했다는 안내가 보인다.

evidence:
  - claim: 기준본이 표준 주문을 통과하지 못하면 수정본 결함으로 판정하지 않고 BASELINE_FAILED 로 멈춘다
    kind: 코드 근거
    where: skillops-agent/skillops_agent/nodes.py 의 _preflight

