[project]
name = "skillops-qa"
version = "0.1.0"
description = "SkillOps 평가셋과 실행기. 정답표 검증(check)과 SkillOps 평가(eval)를 바깥 API 로만 돌린다"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.3",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# 실행 스크립트 모음이라 패키지로 설치하지 않는다.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle 오류, F: pyflakes, I: import 정렬, UP: 최신 문법 권장
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 테스트가 qa/qa_logic.py 를 바로 import 하도록 qa 폴더를 경로에 넣는다.
pythonpath = ["."]
