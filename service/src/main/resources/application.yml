spring:
  application:
    name: skillops-service

  datasource:
    # docker compose up 으로 뜨는 postgres:17. 로컬 brew PG를 쓰려면 env 로 덮어쓴다.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:skillops}
    username: ${POSTGRES_USER:skillops}
    password: ${POSTGRES_PASSWORD:skillops}

  jpa:
    hibernate:
      ddl-auto: update        # 2일 캡스톤용. 스키마 확정 후에도 그대로 둔다.
    open-in-view: false

  ai:
    model:
      chat: openai
    openai:
      # 키가 없어도 부팅은 되어야 한다(빌드·MCP ping 확인용). 실제 호출 시 401.
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        model: ${SKILLOPS_MODEL:gpt-4o-mini}
    mcp:
      server:
        name: skillops-service
        version: 0.1.0
        # 세션을 유지하는 Streamable HTTP. 엔드포인트는 기본값 POST /mcp.
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true

skillops:
  order-agent:
    # 주문 Agent(order-agent/) 조회 API. 고정 설정값으로만 바꾸고 도구 입력으로 받지 않는다.
    base-url: ${ORDER_AGENT_BASE_URL:http://localhost:8081}
  # C-2 연습 공간·시험 주문 돌리기
  skills-dir: ${SKILLOPS_SKILLS_DIR:../skills}
  scenarios-dir: ${SKILLOPS_SCENARIOS_DIR:../scenarios}
  # 시험 주문 실행기. 둘 중 하나만 뜬다.
  #   contract-only(기본): SKILL.md 맨 위 칸만 보고 흉내 내는 C-2 가짜 실행기. 재현 주문(f-<execution_id>, replay_run_ids)은 받지 않는다
  #   harness: 주문 Agent(order-agent.base-url)에 연습 공간 파일을 후보 snapshot 으로 올리고 모의 실행(POST /api/dry-runs)한다.
  #            연습 공간을 create_workspace 의 snapshot_id 로 만들어야 하고, 재현 주문도 돌린다
  flow-runner: ${SKILLOPS_FLOW_RUNNER:contract-only}
  agent:
    # SkillOps 진단 Agent(skillops-agent/). 승인 결과를 전달할 때만 부른다.
    base-url: ${SKILLOPS_AGENT_URL:http://localhost:8000}
    # skillops-agent 의 X-Service-Token 과 같은 값. 비어 있으면 헤더를 보내지 않는다(Agent 개발 모드).
    service-token: ${SKILLOPS_SERVICE_TOKEN:}
  auth:
    # HS256 서명 키, 32바이트 이상. 비어 있으면 기동할 때마다 임시 키를 만든다(재시작하면 다시 로그인).
    jwt-secret: ${SKILLOPS_JWT_SECRET:}
    token-ttl: 2h
    # 로컬 데모 계정. 기본 비밀번호는 owner1234 / operator1234 이며 env 의 BCrypt 해시로 바꾼다.
    users:
      - username: owner
        display-name: 업무 담당자
        roles: [OWNER]
        password-hash: ${SKILLOPS_OWNER_PASSWORD_HASH:$2a$10$mApbyUV.XssNTUQg7FvfmexXvLJlMPRcB4GAGoAadaeD.6pzZCnXC}
      - username: operator
        display-name: 운영자
        roles: [OPERATOR]
        password-hash: ${SKILLOPS_OPERATOR_PASSWORD_HASH:$2a$10$3vF955z/KEJ7Y2qSrqJWZu9hJ0ssv8ZTh/s/v.BzCymd0vlwgrmdW}

server:
  port: 8080

logging:
  level:
    '[org.springframework.ai]': INFO
    '[org.springframework.ai.mcp]': DEBUG
