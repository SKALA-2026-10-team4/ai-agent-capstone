[project]
name = "skillops-agent"
version = "0.1.0"
description = "SkillOps Agent — SKILL.md 변경으로 깨진 agent 흐름을 진단하고, 격리 검증을 통과한 수정안만 제안한다"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openai",
    "mcp",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
    "python-dotenv",
    "langgraph>=1.2.16",
    "langchain-openai>=1.7.2",
    "langchain-core>=1.6.12",
    "pytest-asyncio>=1.4.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.38",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle 오류, F: pyflakes, I: import 정렬, UP: 최신 문법 권장
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
