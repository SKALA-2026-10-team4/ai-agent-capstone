[project]
name = "skillops-agent"
version = "0.1.0"
description = "SkillOps Agent — SKILL.md 변경으로 깨진 agent 흐름을 진단하고, 격리 검증을 통과한 수정안만 제안한다"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic",
    "mcp",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle 오류, F: pyflakes, I: import 정렬, UP: 최신 문법 권장
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
